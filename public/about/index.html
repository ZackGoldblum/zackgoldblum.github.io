<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /about was retired in v4; this stub makes the redirect visible to crawlers,
         which the client-side <Navigate> in App.tsx cannot do on static hosting. -->
    <meta http-equiv="refresh" content="0; url=/timeline" />
    <link rel="canonical" href="https://www.zackgoldblum.com/timeline" />
    <meta name="robots" content="noindex" />
    <title>Redirecting to Timeline</title>
  </head>
  <body>
    <p>Redirecting to <a href="/timeline">/timeline</a>.</p>
  </body>
</html>
